[project]
name = "needle-select-run"

[paths]
project_root = ".."
data_dir = "data"
output_dir = "output"
work_dir = "work"
raw_dir = "raw data"
manifest = "data/manifest.csv"
splits = "data/splits.csv"
predictions_dir = "output/predictions"
scripts_dir = "scripts"

[configs]
preprocess_config = "configs/preprocess.toml"
train_config = "configs/train.toml"
inference_profile = "configs/inference_profile.json"

[model]
# Set this to the unified v2 checkpoint. Run screen.ps1 to verify it.
checkpoint = ""

[inference]
# File or directory for direct inference. Leave empty until configured.
input = ""
threshold = 0.5
patch_size = 256
overlap = 0.5
channel_mode = "max"
channel = 0
# Set one of 20.0, 40.0, or 60.0 when known. Otherwise it is estimated and mapped.
# input_magnification = 60.0
trained_magnification = 40.0
auto_magnification = true
clean_components = true
min_diameter_ratio = 0.35
max_diameter_ratio = 2.5
save_circle_rois = true
circle_radius_padding = 0.0
circle_min_area = 4
circle_center_mode = "lattice"
circle_radius_mode = "global-quantile"
circle_component_coverage_quantile = 0.99
circle_global_radius_quantile = 0.99
circle_radius_anomaly_ratio = 1.5
circle_radius_anomaly_mad = 6.0
lattice_min_points = 6
lattice_max_snap_distance = 4.0
recursive = true

[commands]
python = "python"
