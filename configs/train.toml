# Training defaults for the first nano-needle segmentation model.

[data]
manifest = "data/manifest.csv"
splits = "data/splits.csv"
image_column = "image_path"
mask_column = "mask_path"
cache_images = true

[split]
val_fraction = 0.15
test_fraction = 0.15
seed = 42

[patches]
patch_size = 512
patches_per_image = 48
positive_patch_fraction = 0.70

[augmentation]
enable = true
flip = true
rotate90 = true
intensity_jitter = 0.10

[model]
in_channels = 1
out_channels = 1
base_channels = 32
depth = 4
dropout = 0.05

[training]
epochs = 80
batch_size = 8
learning_rate = 0.0003
weight_decay = 0.00001
num_workers = 2
device = "auto"
amp = true
pin_memory = true
persistent_workers = true
prefetch_factor = 2
cudnn_benchmark = true
bce_weight = 0.5
dice_weight = 0.5
threshold = 0.5

[output]
run_dir = "runs/unet_baseline"
save_every_epochs = 10
