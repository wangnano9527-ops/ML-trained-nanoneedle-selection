[project]
name = "needle-select-local"

[paths]
project_root = ".."
data_dir = "data"
output_dir = "output"
work_dir = "work"
raw_dir = "raw data"
manifest = "data/manifest.csv"
splits = "data/splits.csv"
predictions_dir = "predictions"
scripts_dir = "scripts"

[configs]
preprocess_config = "configs/preprocess.toml"
train_config = "configs/train.toml"
inference_profile = "configs/inference_profile_unified_v2.json"

[model]
# Put exported checkpoints outside Git, then reference them here.
checkpoint = "models/needle_unet_unified_v2.pt"

[inference]
input = "data/input"
threshold = 0.5
patch_size = 256
overlap = 0.5
channel = 0
# For 60x images with a 40x-trained model, 0.6667 is a useful manual start.
# scale = 0.6667
# input_magnification = 60.0
trained_magnification = 40.0
recursive = true

[commands]
python = "python"
