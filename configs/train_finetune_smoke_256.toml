# Fine-tune the current best U-Net with new 256x256 manually corrected smoke tiles.

[data]
manifest = "data/manifest_finetune_smoke_256.csv"
splits = "data/splits_finetune_smoke_256.csv"
image_column = "image_path"
mask_column = "mask_path"
cache_images = true

[split]
val_fraction = 0.15
test_fraction = 0.15
seed = 42

[patches]
patch_size = 256
patches_per_image = 48
positive_patch_fraction = 0.85

[augmentation]
enable = true
flip = true
rotate90 = true
intensity_jitter = 0.08

[model]
in_channels = 1
out_channels = 1
base_channels = 32
depth = 4
dropout = 0.05

[checkpoint]
init = "runs/unet_finetune_manual/best.pt"

[training]
epochs = 20
batch_size = 16
learning_rate = 0.00005
weight_decay = 0.00001
num_workers = 2
device = "auto"
amp = true
pin_memory = true
persistent_workers = true
prefetch_factor = 2
cudnn_benchmark = true
bce_weight = 0.5
dice_weight = 0.5
threshold = 0.5

[output]
run_dir = "runs/unet_finetune_smoke_256"
save_every_epochs = 5
