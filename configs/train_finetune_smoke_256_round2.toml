# Second smoke-tile fine-tune from the latest unified model.

[data]
manifest = "data/manifest_finetune_smoke_256_round2.csv"
splits = "data/splits_finetune_smoke_256_round2.csv"
image_column = "image_path"
mask_column = "mask_path"
cache_images = true

[split]
val_fraction = 0.15
test_fraction = 0.15
seed = 20260608

[patches]
patch_size = 256
patches_per_image = 32
positive_patch_fraction = 0.85

[augmentation]
enable = true
flip = true
rotate90 = true
intensity_jitter = 0.08

[model]
in_channels = 1
out_channels = 1
base_channels = 32
depth = 4
dropout = 0.05

[checkpoint]
init = "dist/needle-select-inference-unified-20260606/models/needle_unet_unified.pt"

[training]
epochs = 30
batch_size = 16
learning_rate = 0.00003
weight_decay = 0.00001
num_workers = 2
device = "auto"
amp = true
pin_memory = true
persistent_workers = true
prefetch_factor = 2
cudnn_benchmark = true
bce_weight = 0.5
dice_weight = 0.5
threshold = 0.5

[output]
run_dir = "runs/unet_finetune_smoke_256_round2"
save_every_epochs = 5
